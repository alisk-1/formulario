<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FÓMULARIO DE CADASTRO</title>
</head>
<body>

    
    <h2 id = "celular">Celular</h2>
    <h2 id = "desktop">Desktop</h2>
    
    <div class="container">

        <div class="form_box">
            <h1 class="title">Formulário</h1>
            
            
            
            <form action="" method="get">
                
                

                <input type="nome" name ="nome" placeholder="Nome completo">
                <input type="cidade" name = "cidade" placeholder="Cidade:"> 
                <input type="bairro" name = "bairro" placeholder="Bairro:">
                <input type="rua" name = "rua" placeholder="Rua:">
                <input type="number" name = "number" placeholder="N°:">
                <input type="referencia" name = "referencia" placeholder="Referencia:">
                <input type="data_de_nascimento" name = "data_de_nascimento" placeholder="Data de nascmento:">
                <label for="genero">Genero:</label>
                <select id="genero">
                    <option>Masculino</option>
                    <option>Femino</option>
                    <option>Outros</option>
                </select>
                <label for="estado_civil" >Estado civil</label>
                <select id="estado_civil">
                    <option>Solteiro</option>
                    <option>Casado</option>
                    <option>Viúvo</option>
                    <option>Divorciado</option>
                </select>
                <input type="email" name = "email" placeholder="Email:">
                <input type="senha" name = "senha" placeholder="Senha:">

                <button type="subnit">Enviar</button>
                
            </form>


        </div>

    </div>


</body>
</html>
